---
- name: install observability components in cluster
  hosts: masters
  become: true
  tasks:
    - name: Add prometheus chart repo
      kubernetes.core.helm_repository:
        name: prometheus
        repo_url: "https://prometheus-community.github.io/helm-charts/"
    - name: Deploy latest version of prometheus chart inside monitoring namespace (and create it)
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus/kube-prometheus-stack
        release_namespace: monitoring
        kubeconfig: /etc/kubernetes/admin.conf
        create_namespace: true
    - name: Add grafana chart repo
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: "https://grafana.github.io/helm-charts"
      ignore_errors: true
    - name: Deploy latest version of grafana chart inside monitoring namespace (and create it)
      kubernetes.core.helm:
        name: grafana
        chart_ref: grafana/grafana
        release_namespace: monitoring
        kubeconfig: /etc/kubernetes/admin.conf
        create_namespace: true
    - name: Add loki chart repo
      kubernetes.core.helm_repository:
        name: loki
        repo_url: "https://grafana.github.io/helm-charts"
      ignore_errors: true
    - name: Deploy latest version of loki chart inside monitoring namespace (and create it)
      kubernetes.core.helm:
        name: loki
        chart_ref: loki/loki
        release_namespace: monitoring
        kubeconfig: /etc/kubernetes/admin.conf
        create_namespace: true
        values:
          loki:
            useTestSchema: true
            commonConfig:
              replication_factor: 1
            storage:
              type: filesystem
            auth_enabled: false
          singleBinary:
            replicas: 1
          read:
            replicas: 0
          write:
            replicas: 0
          backend:
            replicas: 0
    - name: Deploy latest version of promtail chart inside monitoring namespace (and create it)
      kubernetes.core.helm:
        name: promtail
        chart_ref: grafana/promtail
        release_namespace: monitoring
        kubeconfig: /etc/kubernetes/admin.conf
        create_namespace: true
